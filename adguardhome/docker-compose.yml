version: '3.9'

services:
  adguardhome:
    image: adguard/adguardhome
    container_name: adguardhome
    restart: always
    # Host networking so AdGuard sees real client IPs (bridge NAT shows every client as the
    # Docker gateway) and can run the DHCP server. Binds directly on the host:
    # 53 (DNS), 853 (DNS over TLS), 9080 (web UI, proxied by Traefik), 67/udp (DHCP).
    network_mode: host
    volumes:
      - ./adguardhome/work:/opt/adguardhome/work
      - ./adguardhome/conf:/opt/adguardhome/conf
      - ./adguardhome/certs:/opt/adguardhome/certs
    labels:
      - traefik.enable=true
      - traefik.http.routers.adguardhome.rule=(Host(`${ADGUARD_HOSTNAME}`))
      - traefik.http.routers.adguardhome.tls=true
      - traefik.http.routers.adguardhome.tls.certresolver=myresolver
      - traefik.http.services.adguardhome.loadbalancer.server.port=9080

      - homepage.group=Utilities
      - homepage.name=Adguard
      - homepage.icon=adguard-home.png
      - homepage.href=https://${ADGUARD_HOSTNAME}
      - homepage.description=DNS Adblocker
      - homepage.weight=0
      - homepage.widget.type=adguard
      - homepage.widget.url=https://${ADGUARD_HOSTNAME}
      - homepage.widget.username=${ADGUARD_USERNAME}
      - homepage.widget.password=${ADGUARD_PASSWORD}

  traefik-certs-dumper:
    image: ldez/traefik-certs-dumper
    container_name: traefik-certs-dumper
    restart: always
    entrypoint: sh -c '
      apk add jq
      ; while ! [ -e /data/acme.json ]
      || ! [ `jq ".[] | .Certificates | length" /data/acme.json` != 0 ]; do
      sleep 1
      ; done
      && traefik-certs-dumper file --version v2 --watch
      --clean false
      --source /data/acme.json --dest /certs'
    volumes:
      - ./letsencrypt:/data
      - ./adguardhome/certs:/certs
