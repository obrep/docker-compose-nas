version: '3.9'

services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    hostname: jackfruit
    restart: always
    # Host networking with a real TUN device so tailnet traffic to the NAS's LAN IP is
    # delivered locally (Traefik, DSM, AdGuard all keep working on 192.168.1.101).
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - TS_AUTHKEY=${TAILSCALE_AUTHKEY}
      # Only use the auth key on first login; afterwards the saved state is used.
      - TS_AUTH_ONCE=true
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      # Keep the NAS's own DNS untouched (AdGuard runs on this host).
      - TS_ACCEPT_DNS=false
      # Share only the NAS itself, not the whole LAN, so the public A record
      # (nas.domain.com -> 192.168.1.101) works from anywhere on the tailnet.
      - TS_ROUTES=${TAILSCALE_ROUTES:-192.168.1.101/32}
      - TS_EXTRA_ARGS=${TAILSCALE_EXTRA_ARGS:-}
      # Opt out of sending client logs to Tailscale.
      - TS_NO_LOGS_NO_SUPPORT=true
      # Local /healthz endpoint for the healthcheck below (autoheal restarts it if unhealthy).
      - TS_ENABLE_HEALTH_CHECK=true
      - TS_LOCAL_ADDR_PORT=127.0.0.1:9002
    volumes:
      - ./tailscale/state:/var/lib/tailscale
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9002/healthz"]
      interval: 1m
      retries: 5
      start_period: 30s
    labels:
      - homepage.group=Utilities
      - homepage.name=Tailscale
      - homepage.icon=tailscale.png
      - homepage.href=https://login.tailscale.com/admin/machines
      - homepage.description=Remote access
      - homepage.weight=1
      - homepage.widget.type=tailscale
      - homepage.widget.deviceid=${TAILSCALE_DEVICE_ID}
      - homepage.widget.key=${TAILSCALE_API_KEY}
